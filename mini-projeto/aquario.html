<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Aquário 2D — Transformações Geométricas</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    canvas { display: block; }
    #info { position: absolute; top: 10px; left: 10px; color: #dde; pointer-events: none;
      font: 13px monospace; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 4px; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="info">
  Clique: bolhas | F: novo peixe | M: espelhar | S: ondulação | Espaço: pausar | R: resetar
</div>

<script>
// =============================================================
// SETUP DO CANVAS
// =============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// =============================================================
// ESTADO GLOBAL
// =============================================================
let tempo = 0;
let pausado = false;
let espelhado = false;   // tecla M
let ondulando = false;   // tecla S

// =============================================================
// PASSO 1: FUNÇÕES DE DESENHO
// Cada objeto é desenhado centrado na ORIGEM (0,0).
// As transformações (feitas antes de chamar) posicionam, giram e escalam.
// =============================================================

function desenhaBolha(raio) {
  ctx.beginPath();
  ctx.arc(0, 0, raio, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
}

// Estrela-do-mar com o CENTRO em (cx, cy) — coordenadas absolutas da cena.
// (Desenhada assim de propósito, para mostrar a escala com ponto fixo T → S → T.)
function desenhaEstrelaDoMar(cx, cy, raio) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = (i % 2 === 0) ? raio : raio * 0.45;     // pontas e reentrâncias
    const ang = -Math.PI / 2 + i * Math.PI / 5;
    const x = cx + r * Math.cos(ang);
    const y = cy + r * Math.sin(ang);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = '#ff6f61';
  ctx.fill();
  ctx.strokeStyle = '#d94f43';
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Pintinhas nos braços
  ctx.fillStyle = '#ffb199';
  for (let i = 0; i < 5; i++) {
    const ang = -Math.PI / 2 + i * 2 * Math.PI / 5;
    ctx.beginPath();
    ctx.arc(cx + raio * 0.55 * Math.cos(ang), cy + raio * 0.55 * Math.sin(ang), 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
}

// O peixe aponta para +x. A cauda tem 2 partes (base e ponta) = HIERARQUIA.
function desenhaPeixe(cor, cor2, cauda, ponta) {
  // --- Cauda ---
  ctx.save();
    // [5] ROTAÇÃO COM PONTO FIXO em (-20, 0):  T → R → T
    ctx.translate(-20, 0);
    ctx.rotate(cauda);
    ctx.translate(20, 0);
    ctx.fillStyle = cor2;
    ctx.beginPath();
    ctx.moveTo(-20, -5); ctx.lineTo(-34, -3); ctx.lineTo(-34, 3); ctx.lineTo(-20, 5);
    ctx.closePath();
    ctx.fill();

    // Ponta da cauda: FILHA da base (herda a rotação e soma a sua)
    ctx.translate(-34, 0);
    ctx.rotate(ponta);
    ctx.translate(34, 0);
    ctx.beginPath();
    ctx.moveTo(-32, 0); ctx.lineTo(-54, -15); ctx.lineTo(-54, 15);
    ctx.closePath();
    ctx.fill();
  ctx.restore();

  // --- Corpo ---
  ctx.fillStyle = cor;
  ctx.beginPath();
  ctx.ellipse(0, 0, 28, 15, 0, 0, Math.PI * 2);
  ctx.fill();

  // Listras (recortadas pelo corpo)
  ctx.save();
    ctx.clip();
    ctx.fillStyle = cor2;
    ctx.fillRect(-9, -20, 7, 40);
    ctx.fillRect(5, -20, 4, 40);
  ctx.restore();

  // --- Nadadeiras ---
  ctx.fillStyle = cor2;
  ctx.beginPath();
  ctx.moveTo(-14, -12); ctx.quadraticCurveTo(-4, -30, 10, -12);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(4, 10, 4, 9, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // --- Olho ---
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(17, -4, 3.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#101820';
  ctx.beginPath(); ctx.arc(18, -4, 1.8, 0, Math.PI * 2); ctx.fill();
}

// =============================================================
// PASSO 2: DADOS DA CENA
// =============================================================

// Pares de cores [corpo, detalhes]
const cores = [
  ['#ff7a59', '#ffc2a8'], ['#ffc93c', '#f08a24'], ['#f25f8e', '#ffb3cc'],
  ['#b48cff', '#e2d2ff'], ['#f3efe0', '#ff8a5b'], ['#ff9f43', '#ffe0a8']
];

function criaPeixe() {
  const c = cores[Math.floor(Math.random() * cores.length)];
  return {
    x: Math.random() * canvas.width,
    y: canvas.height * (0.15 + Math.random() * 0.5),
    vel: 0.8 + Math.random() * 1.2,
    dir: Math.random() < 0.5 ? -1 : 1,     // 1 = direita, -1 = esquerda
    tam: 0.7 + Math.random() * 0.6,
    cor: c[0], cor2: c[1],
    fase: Math.random() * 6
  };
}

function criaBolha(x, y) {
  return { x: x, x0: x, y: y, y0: y, r: 3 + Math.random() * 3,
           vel: 0.6 + Math.random() * 0.8, fase: Math.random() * 6 };
}

let peixes = [];
for (let i = 0; i < 7; i++) peixes.push(criaPeixe());

let bolhas = [];

// x é uma fração da largura da tela (0 a 1)
const algas = [
  { x: 0.05, seg: 7, len: 30, fase: 0.0 },
  { x: 0.18, seg: 8, len: 32, fase: 1.3 },
  { x: 0.30, seg: 6, len: 28, fase: 2.1 },
  { x: 0.52, seg: 7, len: 30, fase: 0.7 },
  { x: 0.66, seg: 8, len: 34, fase: 2.9 },
  { x: 0.78, seg: 6, len: 26, fase: 1.8 },
  { x: 0.95, seg: 7, len: 30, fase: 3.6 }
];

// =============================================================
// PASSO 3: LOOP DE ANIMAÇÃO
// =============================================================

function animar() {
  // [6] RESET da matriz (obrigatório!) — todo frame começa da identidade
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const chao = canvas.height - 90;   // altura do topo da areia

  // Fundo (desenhado sem transformação)
  const fundo = ctx.createLinearGradient(0, 0, 0, canvas.height);
  fundo.addColorStop(0, '#2a97bd');
  fundo.addColorStop(1, '#0a2c4d');
  ctx.fillStyle = fundo;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // [7] save/restore envolve a cena inteira
  ctx.save();

    // --- PASSO 4: EFEITOS NA CENA INTEIRA ---
    if (espelhado) {
      // [B2] REFLEXÃO: leva a origem para a direita e inverte o eixo x
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    if (ondulando) {
      // [B2] CISALHAMENTO em torno da linha central: T → Shear → T
      ctx.translate(0, canvas.height / 2);
      ctx.transform(1, 0, 0.05 * Math.sin(tempo * 2), 1, 0, 0);   // x' = x + k*y
      ctx.translate(0, -canvas.height / 2);
    }

    // --- Raios de luz ---
    for (let i = 0; i < 5; i++) {
      ctx.save();
        ctx.translate(canvas.width * (0.15 + 0.2 * i), 0);
        // [B2] CISALHAMENTO: inclina o retângulo (x' = x - 0.4*y)
        ctx.transform(1, 0, -0.4 + 0.05 * Math.sin(tempo + i), 1, 0, 0);
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        ctx.fillRect(0, 0, 70, chao + 40);
      ctx.restore();
    }

    // --- Areia ---
    ctx.fillStyle = '#d8c393';
    ctx.fillRect(-100, chao, canvas.width + 200, canvas.height);

    // --- Baú do tesouro ---
    ctx.save();
      ctx.translate(canvas.width * 0.85, chao + 12);   // [1] posição do baú
      ctx.fillStyle = '#8a5a2b';
      ctx.fillRect(-36, -34, 72, 34);                  // corpo
      ctx.fillStyle = '#d4a017';
      ctx.fillRect(-36, -20, 72, 5);                   // faixa
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath();
      ctx.ellipse(0, -34, 30, 7, 0, 0, Math.PI * 2);   // moedas
      ctx.fill();

      // Tampa: [5] ROTAÇÃO COM PONTO FIXO na dobradiça (36, -34): T → R → T
      const abre = 0.5 + 0.5 * Math.sin(tempo * 0.8);  // 0 = fechado, 1 = aberto
      ctx.translate(36, -34);
      ctx.rotate(abre * 1.05);                         // [2] rotação
      ctx.translate(-36, 34);
      ctx.fillStyle = '#a06a34';
      ctx.fillRect(-36, -50, 72, 16);
      ctx.fillStyle = '#d4a017';
      ctx.fillRect(-36, -44, 72, 4);
    ctx.restore();

    // --- Estrela-do-mar pulsando ---
    const ex = canvas.width * 0.40, ey = chao + 45;   // centro da estrela (o ponto fixo)
    ctx.save();
      const pulso = 1 + 0.15 * Math.sin(tempo * 3);
      // [5] ESCALA COM PONTO FIXO em (ex, ey):  T → S → T
      ctx.translate(ex, ey);              // 1) leva o ponto fixo para a origem
      ctx.scale(pulso, pulso);            // 2) [3] escala (cresce e diminui em torno do centro)
      ctx.translate(-ex, -ey);            // 3) devolve o ponto fixo ao lugar
      desenhaEstrelaDoMar(ex, ey, 22);
    ctx.restore();

    // --- Algas ---
    algas.forEach(function(a) {
      ctx.save();
        ctx.translate(a.x * canvas.width, chao + 10);
        ctx.strokeStyle = '#2fa36b';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';

        // [B3] HIERARQUIA + [4] COMPOSIÇÃO: cada segmento é filho do anterior.
        // A matriz acumula rotação + translação + escala a cada volta do laço.
        for (let i = 0; i < a.seg; i++) {
          ctx.rotate(0.11 * Math.sin(tempo * 1.5 + a.fase + i * 0.45));
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(0, -a.len);
          ctx.stroke();
          ctx.translate(0, -a.len);     // vai até a ponta do segmento
          ctx.scale(0.93, 0.93);        // [3] o próximo segmento é menor
        }
      ctx.restore();
    });

    // --- Peixes ---
    peixes.forEach(function(p) {
      // Movimento: vai e volta pela tela
      if (!pausado) {
        p.x += p.vel * p.dir;
        if (p.x > canvas.width - 60) p.dir = -1;
        if (p.x < 60) p.dir = 1;
      }

      const y = p.y + 20 * Math.sin(tempo * 1.5 + p.fase);     // sobe e desce
      const inclina = 0.15 * Math.cos(tempo * 1.5 + p.fase);   // nariz acompanha
      const cauda = 0.45 * Math.sin(tempo * 8 + p.fase);
      const ponta = 0.5 * Math.sin(tempo * 8 + p.fase - 0.9);  // atrasada em relação à base

      ctx.save();
        ctx.translate(p.x, y);              // [1] posição
        ctx.scale(p.dir * p.tam, p.tam);    // [3] escala; [B2] dir = -1 REFLETE o peixe
        ctx.rotate(inclina);                // [2] rotação      → [4] composição T → S → R
        desenhaPeixe(p.cor, p.cor2, cauda, ponta);
      ctx.restore();
    });

    // --- Bolhas ---
    if (!pausado && Math.random() < 0.04) {
      bolhas.push(criaBolha(canvas.width * 0.12, chao));   // bolhas saindo da "pedra de ar"
    }
    bolhas.forEach(function(b) {
      if (!pausado) {
        b.y -= b.vel;
        b.x = b.x0 + 7 * Math.sin(b.fase + b.y * 0.035);
      }
      const esc = 1 + (b.y0 - b.y) / 400;    // cresce enquanto sobe
      ctx.save();
        ctx.translate(b.x, b.y);
        ctx.scale(esc, esc);                 // [3] escala (ponto fixo = centro da bolha)
        desenhaBolha(b.r);
      ctx.restore();
    });
    bolhas = bolhas.filter(function(b) { return b.y > 20; });

  ctx.restore();

  // Atualiza tempo
  if (!pausado) tempo += 0.016;

  requestAnimationFrame(animar);
}

// =============================================================
// PASSO 5: INTERATIVIDADE (mouse e teclado)
// =============================================================
canvas.addEventListener('click', function(e) {
  let x = e.clientX;
  if (espelhado) x = canvas.width - x;   // desfaz o espelhamento para acertar o clique
  for (let i = 0; i < 5; i++) {
    bolhas.push(criaBolha(x + (Math.random() - 0.5) * 30, e.clientY));
  }
});

document.addEventListener('keydown', function(e) {
  switch (e.key) {
    case 'f': case 'F': if (peixes.length < 14) peixes.push(criaPeixe()); break;
    case 'm': case 'M': espelhado = !espelhado; break;
    case 's': case 'S': ondulando = !ondulando; break;
    case ' ':           pausado = !pausado; e.preventDefault(); break;
    case 'r': case 'R':
      peixes = [];
      for (let i = 0; i < 7; i++) peixes.push(criaPeixe());
      bolhas = [];
      espelhado = false; ondulando = false;
      break;
  }
});

window.addEventListener('resize', function() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

// Inicia
animar();
</script>
</body>
</html>
