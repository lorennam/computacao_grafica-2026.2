<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Oceano</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    canvas { display: block; }
    #info { position: absolute; top: 10px; left: 10px; color: #fff; pointer-events: none;
      font: 13px Arial; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 4px; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="info">
  Clique: bolhas | F: novo peixe | M: espelhar | Espaço: pausar | R: resetar
</div>

<script>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let tempo = 0;
let pausado = false;
let espelhado = false;   

// funcoes de desenho

function desenhaBolha(raio) {
  ctx.beginPath();
  ctx.arc(0, 0, raio, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
}

function desenhaPedra(cx, cy, raio) {
  ctx.beginPath();
  ctx.arc(cx, cy, raio, 0, Math.PI * 2);
  ctx.fillStyle = '#8a8a8a';
  ctx.fill();
  ctx.strokeStyle = '#5a5a5a';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(cx + raio * 0.1, cy + raio * 0.4, raio * 0.55, raio * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - raio * 0.3, cy - raio * 0.4);
  ctx.lineTo(cx + raio * 0.1, cy - raio * 0.95);
  ctx.moveTo(cx + raio * 0.2, cy - raio * 0.5);
  ctx.lineTo(cx + raio * 0.35, cy - raio * 0.1);
  ctx.stroke();
}

function desenhaPeixe(cor, cor2, cauda, ponta) {
  ctx.save();
    // rotacao com ponto fixo T → R → T
    ctx.translate(-20, 0);
    ctx.rotate(cauda);
    ctx.translate(20, 0);
    ctx.fillStyle = cor2;
    ctx.beginPath();
    ctx.moveTo(-20, -5); ctx.lineTo(-34, -3); ctx.lineTo(-34, 3); ctx.lineTo(-20, 5);
    ctx.closePath();
    ctx.fill();

    // ponta da cauda
    ctx.translate(-34, 0);
    ctx.rotate(ponta);
    ctx.translate(34, 0);
    ctx.beginPath();
    ctx.moveTo(-32, 0); ctx.lineTo(-54, -15); ctx.lineTo(-54, 15);
    ctx.closePath();
    ctx.fill();
  ctx.restore();

  // corpo
  ctx.fillStyle = cor;
  ctx.beginPath();
  ctx.ellipse(0, 0, 28, 15, 0, 0, Math.PI * 2);
  ctx.fill();

  // listras
  ctx.save();
    ctx.clip();
    ctx.fillStyle = cor2;
    ctx.fillRect(-9, -20, 7, 40);
    ctx.fillRect(5, -20, 4, 40);
  ctx.restore();

  // nadadeiras
  ctx.fillStyle = cor2;
  ctx.beginPath();
  ctx.moveTo(-14, -12); ctx.quadraticCurveTo(-4, -30, 10, -12);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(4, 10, 4, 9, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // olho
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(17, -4, 3.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000000';
  ctx.beginPath(); ctx.arc(18, -4, 1.8, 0, Math.PI * 2); ctx.fill();
}

const cores = [
  ['#ff7a59', '#ffc2a8'], ['#ffc93c', '#f08a24'], ['#f25f8e', '#ffb3cc'],
  ['#b48cff', '#e2d2ff'], ['#f3efe0', '#ff8a5b'], ['#ff9f43', '#ffe0a8']
];

function criaPeixe() {
  const c = cores[Math.floor(Math.random() * cores.length)];
  return {
    x: Math.random() * canvas.width,
    y: canvas.height * (0.15 + Math.random() * 0.5),
    vel: 0.3 + Math.random() * 0.8,
    dir: Math.random() < 0.5 ? -1 : 1,    
    tam: 0.7 + Math.random() * 0.6,
    cor: c[0], cor2: c[1],
    fase: Math.random() * 6
  };
}

function criaBolha(x, y) {
  return { 
    x: x, 
    x0: x, 
    y: y, 
    y0: y, r: 3 + Math.random() * 3,
           vel: 0.6 + Math.random() * 0.8, fase: Math.random() * 6 };
}

let peixes = [];
for (let i = 0; i < 7; i++) peixes.push(criaPeixe());

let bolhas = [];

const algas = [
  { x: 0.05, seg: 7, len: 30, fase: 0.0 },
  { x: 0.18, seg: 8, len: 32, fase: 1.3 },
  { x: 0.30, seg: 6, len: 28, fase: 2.1 },
  { x: 0.52, seg: 7, len: 30, fase: 0.7 },
  { x: 0.66, seg: 8, len: 34, fase: 2.9 },
  { x: 0.78, seg: 6, len: 26, fase: 1.8 },
  { x: 0.95, seg: 7, len: 30, fase: 3.6 }
];

function animar() {
  // reset da matriz
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const chao = canvas.height - 90;

  // fundo
  const fundo = ctx.createLinearGradient(0, 0, 0, canvas.height);
  fundo.addColorStop(0, '#2a97bd');
  fundo.addColorStop(1, '#0a2c4d');
  ctx.fillStyle = fundo;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // save/restore na cena inteira
  ctx.save();

    // efeito de reflexao
    if (espelhado) {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    // areia
    ctx.fillStyle = '#d8c393';
    ctx.fillRect(-100, chao, canvas.width + 200, canvas.height);

    // bau
    ctx.save();
      ctx.translate(canvas.width * 0.85, chao + 12);   // posição do bau
      ctx.fillStyle = '#8a5a2b';
      ctx.fillRect(-36, -34, 72, 34); // corpo
      ctx.fillStyle = '#d4a017';
      ctx.fillRect(-36, -20, 72, 5); // faixa
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath();
      ctx.ellipse(0, -34, 30, 7, 0, 0, Math.PI * 2); // ""moedas""
      ctx.fill();

      // tampa com rotacao com ponto fixo T → R → T
      const abre = 0.5 + 0.5 * Math.sin(tempo * 0.8); 
      ctx.translate(36, -34);
      ctx.rotate(abre * 1.05); // rotação
      ctx.translate(-36, 34);
      ctx.fillStyle = '#a06a34';
      ctx.fillRect(-36, -50, 72, 16);
      ctx.fillStyle = '#d4a017';
      ctx.fillRect(-36, -44, 72, 4);
    ctx.restore();

    // pedra que solta bolha
    const ex = canvas.width * 0.12, ey = chao + 20;  
    ctx.save();
      const pulso = 1 + 0.08 * Math.sin(tempo * 2);
      // [5] escala com ponto fixo T → S → T
      ctx.translate(ex, ey);              
      ctx.scale(pulso, pulso); // escala
      ctx.translate(-ex, -ey);     
      desenhaPedra(ex, ey, 20);
    ctx.restore();

    // algas
    algas.forEach(function(a) {
      ctx.save();
        ctx.translate(a.x * canvas.width, chao + 10);
        ctx.strokeStyle = '#2fa36b';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';

        // hierarquia + composicao - cada segmento é filho do anterior.
        // a matriz acumula rotação + translação + escala a cada volta do laço.
        for (let i = 0; i < a.seg; i++) {
          ctx.rotate(0.11 * Math.sin(tempo * 1.5 + a.fase + i * 0.45));
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(0, -a.len);
          ctx.stroke();
          ctx.translate(0, -a.len);     
          ctx.scale(0.93, 0.93);     
        }
      ctx.restore();
    });

    // peixes
    peixes.forEach(function(p) {
      if (!pausado) {
        p.x += p.vel * p.dir;
        if (p.x > canvas.width - 60) p.dir = -1;
        if (p.x < 60) p.dir = 1;
      } 

      const y = p.y + 20 * Math.sin(tempo * 1.5 + p.fase); // sobe e desce
      const inclina = 0.15 * Math.cos(tempo * 1.5 + p.fase); // nariz acompanha
      const cauda = 0.45 * Math.sin(tempo * 8 + p.fase);
      const ponta = 0.5 * Math.sin(tempo * 8 + p.fase - 0.9);  

      ctx.save();
        ctx.translate(p.x, y); // posicao
        ctx.scale(p.dir * p.tam, p.tam); // escala
        ctx.rotate(inclina); // rotação      
        desenhaPeixe(p.cor, p.cor2, cauda, ponta);
      ctx.restore();
    });

    // --- Bolhas ---
    if (!pausado && Math.random() < 0.04) {
      bolhas.push(criaBolha(canvas.width * 0.12, chao)); // bolhas saindo da "pedra de ar"
    }
    bolhas.forEach(function(b) {
      if (!pausado) {
        b.y -= b.vel;
        b.x = b.x0 + 7 * Math.sin(b.fase + b.y * 0.035);
      }
      const esc = 1 + (b.y0 - b.y) / 400; // cresce enquanto sobe
      ctx.save();
        ctx.translate(b.x, b.y);
        ctx.scale(esc, esc); // escala
        desenhaBolha(b.r);
      ctx.restore();
    });
    bolhas = bolhas.filter(function(b) { return b.y > 20; });

  ctx.restore();

  // atualiza tempo
  if (!pausado) tempo += 0.016;

  requestAnimationFrame(animar);
}

// interatividade
canvas.addEventListener('click', function(e) {
  let x = e.clientX;
  if (espelhado) x = canvas.width - x;   // desfaz o espelhamento para acertar o clique
  for (let i = 0; i < 5; i++) {
    bolhas.push(criaBolha(x + (Math.random() - 0.5) * 30, e.clientY));
  }
});

document.addEventListener('keydown', function(e) {
  switch (e.key) {
    case 'f': case 'F': if (peixes.length < 14) peixes.push(criaPeixe()); break;
    case 'm': case 'M': espelhado = !espelhado; break;
    case ' ':           pausado = !pausado; e.preventDefault(); break;
    case 'r': case 'R':
      peixes = [];
      for (let i = 0; i < 7; i++) peixes.push(criaPeixe());
      bolhas = [];
      espelhado = false;
      break;
  }
});

window.addEventListener('resize', function() {  
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

animar();
</script>
</body>
</html>
